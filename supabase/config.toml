# Supabase project config.
# (Add `project_id` with `supabase link` if you manage the project via CLI.)

# The zoho-lead-sync function is called by a Database Webhook, not by an
# end-user, so it does NOT carry a Supabase user JWT. We authenticate the caller
# ourselves with ZOHO_WEBHOOK_SECRET (see the function), so disable JWT checks.
[functions.zoho-lead-sync]
verify_jwt = false

# send-welcome-email is invoked from the browser (supabase.functions.invoke). We
# keep verify_jwt = false to avoid the CORS-preflight 401 and instead verify the
# caller's JWT + partner/admin role inside the function (see authorizeCaller).
[functions.send-welcome-email]
verify_jwt = false

# Learner-authenticated send after impact submit; JWT checked inside the function.
[functions.send-impact-verification-email]
verify_jwt = false

# Public token-gated approve/reject for external verifiers (no login required).
[functions.resolve-impact-verification]
verify_jwt = false

# Partner-emailed course assessment org reports; JWT + role checked in-function.
[functions.send-course-assessment-report]
verify_jwt = false

# LIFT results to learner (+ employer copy when consented). leadId path is
# anonymous; JWT path loads lift_assessments for the signed-in user.
[functions.send-lift-results-email]
verify_jwt = false

# Browser-invoked SurveyMonkey live question pull; requires user Bearer + SM token secret.
[functions.surveymonkey-survey-details]
verify_jwt = false

[functions.surveymonkey-list-surveys]
verify_jwt = false
